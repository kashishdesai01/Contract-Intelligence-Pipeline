<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#192e2b" />
    <meta
      name="description"
      content="A considered workspace for understanding agreements, amendments, and the evidence behind every term."
    />
    <title>Accord — Contract intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js?v=9e53104ba9b1"></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#agreements"
          ><span class="brandmark">a</span>accord<span class="brand-dot"
            >®</span
          ></a
        >
        <div class="workspace-label">YOUR WORKSPACE</div>
        <nav aria-label="Main navigation">
          <button class="nav active" data-view="agreements">
            <span data-icon="grid"></span>Agreements<span
              id="nav-count"
              class="nav-count"
              >—</span
            ></button
          ><button class="nav" data-view="review">
            <span data-icon="layers"></span>Review queue<span
              id="review-count"
              class="nav-count"
            ></span></button
          ><button class="nav" data-view="search">
            <span data-icon="search"></span>Explore evidence</button
          ><button class="nav" data-view="activity">
            <span data-icon="clock"></span>Activity
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note">
            <span class="tiny-star">✳</span>
            <h3>Clarity, with a paper trail.</h3>
            <p>Every accepted term has a source. Every change has a history.</p>
          </div>
          <button class="workspace-switch" id="connection">
            <span class="avatar">S</span
            ><span
              ><strong id="workspace-name">Your workspace</strong
              ><small id="workspace-mode">Checking session</small></span
            ><span data-icon="chevrons"></span>
          </button>
        </div>
      </aside>
      <div class="page">
        <header class="topbar">
          <div class="breadcrumb">
            Workspace <span>/</span> <strong id="breadcrumb">Agreements</strong>
          </div>
          <div class="top-actions">
            <span id="mode-indicator" class="mode-indicator"
              ><i></i> Sample data</span
            ><button
              class="icon-button"
              id="help"
              aria-label="About this workspace"
            >
              <span data-icon="help"></span></button
            ><span class="avatar light">KD</span>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div id="content">
            <div class="loading">Opening your workspace…</div>
          </div>
        </main>
        <footer>
          <span
            >ACCORD <span class="footer-dot">·</span> CONTRACT
            INTELLIGENCE</span
          ><span>Built on evidence. Designed for clarity.</span>
        </footer>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <dialog
      id="evidence"
      class="evidence-drawer"
      aria-labelledby="evidence-title"
    ></dialog>
  </body>
</html>
