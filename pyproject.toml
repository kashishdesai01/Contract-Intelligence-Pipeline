[project]
name = "contract-intelligence-pipeline"
version = "0.1.0"
description = "Versioned contract analysis with amendment provenance and durable processing"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "httpx>=0.28,<1",
  "python-docx>=1.1,<2", "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.21,<1", "typer>=0.15,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.125,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[project.scripts]
cip = "cip.cli:app"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and Redis"]
